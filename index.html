<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="星渡内容管理的服务条款与隐私政策">
  <title>法律与隐私 | 星渡内容管理</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #637083;
      --line: #dce3ea;
      --paper: #ffffff;
      --wash: #f3f7f8;
      --brand: #087e8b;
      --brand-dark: #075d66;
      --accent: #ffcc57;
      --coral: #ef6f6c;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
      line-height: 1.75;
    }
    a { color: inherit; }
    .topbar {
      height: 5px;
      background: linear-gradient(90deg, var(--brand) 0 52%, var(--accent) 52% 78%, var(--coral) 78%);
    }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .nav {
      width: min(1080px, calc(100% - 40px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 700;
    }
    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: white;
      background: var(--brand);
      font-size: 18px;
    }
    nav { display: flex; gap: 24px; font-size: 14px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: var(--brand-dark); }
    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    .lede {
      max-width: 720px;
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 17px;
    }
    .date {
      display: inline-block;
      margin: 12px 0 40px;
      padding: 5px 10px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      font-size: 13px;
    }
    .document { border-top: 1px solid var(--line); background: var(--paper); }
    section { padding: 28px 30px; border-bottom: 1px solid var(--line); }
    section h2 {
      margin: 0 0 8px;
      font-size: 19px;
      line-height: 1.45;
      letter-spacing: 0;
    }
    section p { margin: 0; color: #425163; }
    .home-intro {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 40px;
      align-items: end;
      margin-bottom: 50px;
    }
    .summary {
      padding: 22px;
      border-left: 4px solid var(--coral);
      background: var(--paper);
      color: var(--muted);
      font-size: 14px;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .link-card {
      min-height: 210px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease;
    }
    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--brand);
      outline: none;
    }
    .link-card span {
      display: inline-block;
      margin-bottom: 40px;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 700;
    }
    .link-card h2 { margin: 0 0 8px; font-size: 25px; letter-spacing: 0; }
    .link-card p { margin: 0; color: var(--muted); }
    footer {
      padding: 30px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--paper);
      text-align: center;
      font-size: 13px;
    }
    @media (max-width: 680px) {
      .nav { width: min(100% - 28px, 1080px); min-height: 64px; }
      nav { gap: 14px; font-size: 13px; }
      main { width: min(100% - 28px, 920px); padding-top: 44px; }
      .home-intro, .links { grid-template-columns: 1fr; }
      section { padding: 23px 20px; }
      .link-card { min-height: 180px; }
    }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <header>
    <div class="nav">
      <a class="brand" href="/"><span class="mark">星</span><span>星渡内容管理</span></a>
      <nav aria-label="法律文件导航">
        <a href="/terms.html">服务条款</a>
        <a href="/privacy.html">隐私政策</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="home-intro">
      <div>
        <p class="eyebrow">AUTHORIZED CONTENT DATA MANAGEMENT</p>
        <h1>清晰管理，尊重授权</h1>
        <p class="lede">星渡内容管理帮助经过授权的内容创作者查看公开视频和账号统计数据，并将隐私与数据控制权放在用户手中。</p>
      </div>
      <div class="summary">我们不会要求TikTok账号密码，不读取浏览器Cookie，也不会访问未经授权的私密内容。</div>
    </div>
    <div class="links">
      <a class="link-card" href="/terms.html">
        <span>TERMS</span>
        <h2>服务条款</h2>
        <p>了解服务范围、账号授权、合理使用及用户权利。</p>
      </a>
      <a class="link-card" href="/privacy.html">
        <span>PRIVACY</span>
        <h2>隐私政策</h2>
        <p>了解我们如何收集、使用、保存和保护授权数据。</p>
      </a>
    </div>
  </main>
  <footer>© 2026 星渡内容管理 · 仅处理用户明确授权的数据</footer>
</body>
</html>
